# StockDesk — nginx site (HTTP → redirect to HTTPS after certbot)
# Install as: /etc/nginx/sites-available/stockdesk
# Symlink:    /etc/nginx/sites-enabled/stockdesk
#
# Replace STOCKDESK_DOMAIN with your subdomain before first enable,
# or let deploy/setup_ec2.sh sed it for you.

upstream stockdesk_app {
    server unix:/run/stockdesk/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name STOCKDESK_DOMAIN;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/stockdesk/app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Local media fallback when AWS_STORAGE_BUCKET_NAME is empty.
    # With S3 enabled, Django serves media URLs from the bucket; this block is unused.
    location /media/ {
        alias /opt/stockdesk/app/media/;
        expires 1d;
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://stockdesk_app;
    }

    location /health/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stockdesk_app;
        access_log off;
    }
}
