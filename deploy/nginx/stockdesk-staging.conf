# StockDesk staging — separate nginx server on port 8080 (same EC2 host).
# Install as: /etc/nginx/sites-available/stockdesk-staging
# Does not use the production domain/cert unless you add one later.

upstream stockdesk_staging_app {
    server unix:/run/stockdesk-staging/gunicorn.sock fail_timeout=0;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/stockdesk/app/staticfiles/;
        expires 1d;
        access_log off;
    }

    location /media/ {
        alias /opt/stockdesk/app/media_staging/;
        expires 1d;
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://stockdesk_staging_app;
    }

    location /health/ {
        proxy_set_header Host $host;
        proxy_pass http://stockdesk_staging_app;
        access_log off;
    }
}
