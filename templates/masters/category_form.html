{% extends "base.html" %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} category · StockDesk{% endblock %}
{% block content %}
<header>
    <h1 class="sd-page-title">{% if object %}Edit category{% else %}Add category{% endif %}</h1>
</header>
<section class="sd-panel" style="max-width:560px;">
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "masters/_form_fields.html" %}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="sd-btn-primary" style="width:auto;padding:0.7rem 1.4rem;">Save</button>
            <a href="{% url 'masters:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
